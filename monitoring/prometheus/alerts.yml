groups:
  - name: microservice-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (
              rate(http_requests_total{status=~"5..", endpoint!="/load-test"}[2m])
            )
            /
            clamp_min(
              sum by (service) (
                rate(http_requests_total{endpoint!="/load-test"}[2m])
              ),
              0.000001
            )
          ) > 0.05
          and
          sum by (service) (
            rate(http_requests_total{endpoint!="/load-test"}[2m])
          ) > 0.1

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "High error rate in {{ $labels.service }}"
          description: "5xx error rate exceeded 5%."

      - alert: ServiceDown
        expr: up{job=~".*-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for more than 1 minute."
